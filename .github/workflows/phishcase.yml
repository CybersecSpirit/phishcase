name: PhishCase checks
on:
  push:
    branches: [master, 'feature/investigation-platform', 'feature/release-candidate-v1']
  pull_request:
    paths:
      - 'backend/investigation/**'
      - 'tests_workspace/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'frontend/**'
      - '.github/workflows/phishcase.yml'
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install -r requirements.txt && uv sync --frozen
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend
      - run: uv run ruff check backend/investigation tests_workspace
      - run: uv run python -m pytest tests_workspace -q
      - run: docker compose -p phishcase-ci build
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
