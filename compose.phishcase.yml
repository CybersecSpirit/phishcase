services:
  phishcase:
    build:
      context: .
      dockerfile: Dockerfile
    image: phishcase:local
    command: ["circusd", "/usr/src/app/circus.ini"]
    ports:
      - "127.0.0.1:${PHISHCASE_PORT:-8088}:8000"
    environment:
      INVESTIGATION_DB: /data/phishcase.sqlite3
      EVIDENCE_ROOT: /data/evidence
      CONNECTIVITY_MODE: "${CONNECTIVITY_MODE:-offline}"
      JOB_TIMEOUT_SECONDS: "${JOB_TIMEOUT_SECONDS:-180}"
      JOB_MAX_ATTEMPTS: "${JOB_MAX_ATTEMPTS:-3}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      VIRUSTOTAL_API_KEY: "${VIRUSTOTAL_API_KEY:-}"
      URLSCAN_API_KEY: "${URLSCAN_API_KEY:-}"
      VIRUSTOTAL_LOOKUP_ENABLED: "${VIRUSTOTAL_LOOKUP_ENABLED:-true}"
      URLSCAN_LOOKUP_ENABLED: "${URLSCAN_LOOKUP_ENABLED:-true}"
      VIRUSTOTAL_ALLOW_FILE_SUBMISSION: "${VIRUSTOTAL_ALLOW_FILE_SUBMISSION:-false}"
      VIRUSTOTAL_ALLOW_URL_SUBMISSION: "${VIRUSTOTAL_ALLOW_URL_SUBMISSION:-false}"
      URLSCAN_ALLOW_URL_SUBMISSION: "${URLSCAN_ALLOW_URL_SUBMISSION:-false}"
      MFA_ENCRYPTION_KEY: "${MFA_ENCRYPTION_KEY:-}"
      WEB_CONCURRENCY: "1"
      SPAMD_USERNAME: nobody
      SPAMD_GROUPNAME: nogroup
    volumes:
      - phishcase-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 2g
    restart: unless-stopped
    stop_grace_period: 210s
volumes:
  phishcase-data:
